<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Year 9 Weekly Do Now 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one question per screen. Header = progress through the 4 project steps. Next unlocks only after the right answer.
   Colours match "A Day with Python": project magenta, plus one colour per project step. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#e5ecf6; --line:#cfd9e8;
  --ink:#13203a; --ink-dim:#4d5d78;
  --accent:#a61e8c; --s0:#5f3dc4; --s1:#1f63d6; --s2:#d9480f; --s3:#0b7f8f; --s4:#a61e8c;
  --right:#2b8a3e; --right-bg:#e3f6e7; --wrong:#c92a4b; --wrong-bg:#fde8ec; --gold:#f5b000;
  --code-bg:#1b1f27; --code-ink:#e8edf6; --code-dim:#6b7486;
  --kw:#ff7a90; --str:#b5e48c; --num:#c9a0ff; --fn:#6fd3ff;
  --f-head:"Lexend","Segoe UI",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --f-code:"JetBrains Mono",Consolas,"Courier New",monospace;
  --topic:var(--accent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1522; --surface:#182134; --surface-2:#212c42; --line:#2e3b56; --ink:#eaf0fa; --ink-dim:#a6b4ca;
  --accent:#e463c9; --s0:#9775fa; --s1:#5b9bff; --s2:#ff8a4c; --s3:#3cc6d6; --s4:#e463c9;
  --right:#51cf66; --right-bg:#163322; --wrong:#ff6b88; --wrong-bg:#3a1822; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1522; --surface:#182134; --surface-2:#212c42; --line:#2e3b56; --ink:#eaf0fa; --ink-dim:#a6b4ca;
  --accent:#e463c9; --s0:#9775fa; --s1:#5b9bff; --s2:#ff8a4c; --s3:#3cc6d6; --s4:#e463c9;
  --right:#51cf66; --right-bg:#163322; --wrong:#ff6b88; --wrong-bg:#3a1822; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
code,pre,.mono,.code,.opt code{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:clamp(17px,0.6vw + 13px,22px);line-height:1.5}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.st-fund{--topic:var(--s0)}.st-io{--topic:var(--s1)}.st-var{--topic:var(--s2)}.st-sel{--topic:var(--s3)}.st-iter{--topic:var(--s4)}
.setpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:640px}
.setbtn{font:inherit;cursor:pointer;background:var(--surface);border:3px solid var(--line);border-bottom-width:6px;border-radius:18px;padding:14px 8px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.setbtn:hover{transform:translateY(-3px);border-color:var(--accent)}
.setbtn b{font-family:var(--f-head);font-weight:800;font-size:2rem;color:var(--accent);line-height:1}
.setbtn span{font-size:.8rem;color:var(--ink-dim);font-weight:700}
.topics{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.topics span{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--topic);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}
@media (max-width:560px){.setpick{grid-template-columns:repeat(2,minmax(0,1fr))}}

header{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px}
.hrow{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--f-head);font-weight:800;white-space:nowrap}
.logo span{color:var(--accent)}
.bar{flex:1;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;min-width:0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4));transition:width .5s}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 12px;font-family:var(--f-head);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.bump{animation:bump .5s}
.chip.late{background:var(--wrong-bg);color:var(--wrong)}
@keyframes bump{50%{transform:scale(1.2)}}

main{flex:1;overflow:auto;padding-block:clamp(16px,3vw,36px)}
.stage{max-width:820px;margin:0 auto}
.slide{display:flex;flex-direction:column;gap:16px;animation:slideIn .35s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.8rem;font-weight:700;color:var(--ink-dim)}
.pill{background:var(--topic);color:#fff;border-radius:999px;padding:3px 12px;letter-spacing:.05em;text-transform:uppercase}
.qtext{font-family:var(--f-head);font-weight:800;font-size:clamp(1.35rem,1.8vw + .5rem,2rem);line-height:1.25;margin:0}
.ctx{margin:0;color:var(--ink-dim);font-size:1.05em}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:14px;overflow-x:auto;font-family:var(--f-code);line-height:1.7}
.code pre{margin:0;padding:12px 0;counter-reset:ln}
.code .ln{display:block;padding:0 14px 0 0;white-space:pre}
.code .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:2.2em;text-align:right;padding-right:12px;margin-right:12px;color:var(--code-dim);border-right:1px solid #2c323e}
.t-kw{color:var(--kw)}.t-str{color:var(--str)}.t-num{color:var(--num)}.t-fn{color:var(--fn)}
.opts{display:grid;gap:12px}
.opt{display:grid;grid-template-columns:2.4em 1fr;gap:14px;align-items:center;text-align:left;font:inherit;font-size:1.08em;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 16px;cursor:pointer;transition:transform .15s,border-color .15s}
.opt:hover:not([disabled]){border-color:var(--topic);transform:translateY(-2px)}
.opt .letter{width:2.4em;height:2.4em;border-radius:10px;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;background:var(--surface-2);color:var(--topic)}
.opt code{font-family:var(--f-code);font-size:.92em;white-space:pre-wrap}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--right);background:var(--right-bg);animation:pop .45s}
.opt.right .letter{background:var(--right);color:#fff}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);opacity:.75;animation:shake .4s}
.opt.wrong .letter{background:var(--wrong);color:#fff}
.opt.dim{opacity:.4}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{border-radius:16px;padding:12px 18px;background:var(--surface);border:3px solid var(--line);display:flex;flex-direction:column;gap:6px;animation:slideIn .3s}
.fb.good{border-color:var(--right)}.fb.bad{border-color:var(--wrong)}
.fb b.v{font-family:var(--f-head);font-weight:800;font-size:1.12rem}
.fb.good b.v{color:var(--right)}.fb.bad b.v{color:var(--wrong)}
.fb p{margin:0}
.lock{font-size:.85rem;color:var(--ink-dim);font-weight:700}

footer{background:var(--surface);border-top:1px solid var(--line);padding-block:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.frow{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:.55em 1.4em;font-weight:700;font-size:1.05rem}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--topic);color:#fff;border-color:var(--topic);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.btn.big{font-size:1.25rem;padding:.7em 1.8em}
button:focus-visible{outline:3px solid var(--topic);outline-offset:2px}
.pos{font-size:.85rem;color:var(--ink-dim);font-variant-numeric:tabular-nums}

.intro,.end{align-items:center;text-align:center}
.intro h1,.end h1{font-family:var(--f-head);font-weight:800;font-size:clamp(2rem,5vw,3.2rem);margin:0;line-height:1.1}
.intro h1 span{color:var(--accent)}
.lead{margin:0;font-size:1.15em;max-width:52ch}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.steps div{background:var(--surface);border:2px solid var(--line);border-top:8px solid var(--topic);border-radius:14px;padding:12px;text-align:left;font-size:.9rem}
.steps b{display:block;font-family:var(--f-head);color:var(--topic)}
.rules{background:var(--surface-2);border-radius:14px;padding:12px 18px;text-align:left;max-width:560px}
.rules p{margin:4px 0}
.stars{display:flex;gap:10px;justify-content:center}
.stars svg{width:72px;height:72px}
.stars .s{fill:var(--line)}.stars .s.on{fill:var(--gold);animation:pop .6s backwards}
.big-num{font-family:var(--f-head);font-weight:800;font-size:clamp(3rem,9vw,5rem);color:var(--accent);line-height:1}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.8}}
.scorerow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.scorerow h1{font-size:clamp(1.6rem,4vw,2.4rem)!important}
.stars.small svg{width:40px;height:40px}
.scoreline{font-family:var(--f-head);font-weight:800;color:var(--accent)}
.trybox{width:100%;background:var(--surface);border:4px solid var(--accent);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(166,30,140,.18);animation:slideIn .5s .4s backwards}
.tryhead{display:flex;flex-direction:column;align-items:center;gap:6px}
.tryhead h2{margin:0;font-family:var(--f-head);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.3rem);color:var(--accent);line-height:1.15}
.tryhead p{margin:0;font-size:1.05em}
.trytag{background:var(--accent);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.trun{font-size:1.1rem!important;padding:.55em 1.3em!important}
.waitnote{background:#fff4d6;color:#5c3b00;border:3px solid #f5b000;border-radius:16px;padding:12px 20px;font-size:1.2em;max-width:600px}
.typer{width:100%;background:#0b0e14;border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#1b1f27;color:#9aa6ba;font-size:.78rem}
.tbar i{width:10px;height:10px;border-radius:50%;background:#ff6b6b}.tbar i:nth-child(2){background:#ffd43b}.tbar i:nth-child(3){background:#51cf66}
.tbar span{margin-left:8px}
.tgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.tcode,.tout{padding:12px 14px;min-height:300px;min-width:0}
.tcode{overflow-x:auto}
.tout{border-left:1px solid #262c38}
.tout pre{white-space:pre-wrap}
.tcode pre,.tout pre{margin:0;font-family:var(--f-code);font-size:.78em;line-height:1.6;color:#e8edf6;white-space:pre-wrap;word-break:break-word;font-variant-ligatures:none}
.tlab{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#6b7486;margin-bottom:6px}
.tcur{color:#ffd43b;animation:blinkc .8s steps(1) infinite}
@keyframes blinkc{50%{opacity:0}}
.ttyped{color:#74c0fc}.tok2{color:#69db7c}.tbad{color:#ff8fa3}
.tln{display:block;white-space:pre;transition:background .2s}.tln.hot{background:rgba(255,212,59,.22);box-shadow:inset 3px 0 0 #ffd43b}
.tctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.trun{font-size:.95rem;padding:.45em 1.1em}
.thint{color:#9aa6ba;font-size:.85rem;font-family:var(--f-body)}
.tin{background:transparent;border:0;border-bottom:2px dashed #74c0fc;color:#74c0fc;font:inherit;width:9ch;outline:none}
#tout div{min-height:1.4em}
@media (max-width:700px){.tgrid{grid-template-columns:1fr}.tout{border-left:0;border-top:1px solid #262c38}.tcode,.tout{min-height:0}
.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.logo{display:none}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="wrap"><div class="hrow"><div class="logo">Year 9 <span id="setlab">Weekly Do Now 1</span></div><div class="bar" aria-hidden="true"><i id="bar"></i></div><div class="chip" id="tchip" title="Time left">⏱ <span id="tmr">5:00</span></div><div class="chip" id="chip">★ <span id="pts">0</span></div></div></header>
  <main class="wrap"><div class="stage" id="stage"></div></main>
  <footer class="wrap"><div class="frow"><button class="btn" id="prev">← Back</button><span class="pos" id="pos"></span><button class="btn primary" id="next">Next →</button></div></footer>
</div>

<script>
(function(){
const STEPS={fund:'Programming basics',io:'Input and output',var:'Variables and data types',sel:'Selection',iter:'Iteration'};
/* 4 Do Nows x 10 questions. Original questions testing the same knowledge as the end-of-term assessment. */
const SETS=[
 [ // Do Now 1
  {s:'fund',ctx:'Maya writes a list of step-by-step instructions that tell the computer how to add up her test scores.',q:'What has Maya written?',opts:['A flow chart','A program','A video'],a:1,hint:'Step-by-step instructions that tell a computer how to do a task...',why:'A program is a series of step-by-step instructions that tell a computer how to solve a task.'},
  {s:'io',code_q:'print("Hello Year 9")',q:'What happens when this line runs?',opts:['Hello Year 9 is sent to the printer','The user has to type Hello Year 9','Hello Year 9 appears on the screen'],a:2,hint:'print() does not use a printer.',why:'print outputs a message on the screen.'},
  {s:'var',q:'Which line stores the number 10 in a variable called score?',opts:['score = 10','print(score)','"score" = 10'],code:1,a:0,hint:'Variable name, then =, then the value.',why:'score = 10 stores the value 10 in the variable score.'},
  {s:'var',q:'What data type is the number 3.75?',opts:['Integer','Float','String'],a:1,hint:'It has a decimal point.',why:'A decimal number is a float (floating point number).'},
  {s:'sel',q:'Which line of code is a decision point in a program?',opts:['print("Hi")','for i in range(5):','if age >= 13:'],code:1,a:2,hint:'Which line asks a question?',why:'if is a decision point. It is selection.'},
  {s:'sel',code_q:'age = 12\n\nif age >= 13:',q:'The if checks: is age >= 13? What is the answer?',opts:['False','No','12'],a:0,hint:'The answer to an if question is not yes or no...',why:'12 is not >= 13, so the answer is False. An if is always answered True or False.'},
  {s:'iter',q:'Which piece of code uses iteration?',opts:['if x == 3:\n    print("Three")','for i in range(3):\n    print("Hi")','name = input("Name? ")'],code:1,a:1,hint:'Iteration means repeating.',why:'The for loop repeats the print 3 times. That is iteration.'},
  {s:'iter',code_q:'for i in range(10):\n    print("Jump!")',q:'This loop repeats a set number of times. What type of loop is it?',opts:['Condition-controlled loop','Count-controlled loop','Infinite loop'],a:1,hint:'It counts to a set number.',why:'A loop that repeats a set number of times is count-controlled.'},
  {s:'fund',code_q:'print("Hi")\nprint("Bye")',q:'How many statements are in this code?',opts:['1','2','0'],a:1,hint:'Each print is one single instruction.',why:'Each print is one statement, so there are 2.'},
  {s:'sel',code_q:'if score > 50:\n    print("Pass")\nelse:\n    print("Try again")',q:'When does the else part run?',opts:['When score > 50 is False','When score > 50 is True','Every time'],a:0,hint:'else is the other path.',why:'else is the path the program takes when the condition is False.'}
 ]
];
let Q=SETS[0];


const KEY='y9-weekly-do-now-1';
const state={i:-1,ans:{},score:0};
/* no saved progress: reloading the page always starts again from the home screen */
try{localStorage.removeItem(KEY)}catch(e){}
function save(){}

const $=s=>document.querySelector(s);
const stage=$('#stage');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(line){
  const re=/("[^"]*"?)|(\b\d+(?:\.\d+)?\b)|(\b(?:if|elif|else|for|while|in)\b)|(\b(?:print|input|int|range)\b)/g;
  let out='',last=0,m;
  while((m=re.exec(line))){out+=esc(line.slice(last,m.index));out+='<span class="'+(m[1]?'t-str':m[2]?'t-num':m[3]?'t-kw':'t-fn')+'">'+esc(m[0])+'</span>';last=re.lastIndex}
  return out+esc(line.slice(last));
}
function codeBlock(c){return '<div class="code"><pre>'+c.split('\n').map(l=>'<span class="ln">'+(hl(l)||' ')+'</span>').join('')+'</pre></div>'}
function stepCls(s){return 'st-'+s}

/* sound: short beeps, generated in the browser */
let actx=null;
function tone(seq){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime+.01;
  seq.forEach(function(x){const o=actx.createOscillator(),g=actx.createGain();o.type=x[2]||'sine';o.frequency.value=x[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+x[1]);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+x[1]+.03);t+=x[1]*.75})}catch(e){}}
const OK=[[660,.12],[990,.2]],NO=[[260,.16,'triangle'],[200,.22,'triangle']];

function renderIntro(){
  $('#app').className='app';
  stage.innerHTML='<div class="slide intro"><h1>Weekly <span>Do Now 1</span></h1>'+
  '<p class="lead">Get ready for your <b>end-of-term multiple choice assessment</b>. 10 questions, 5 minutes. When you finish, <b>wait for instructions from your teacher</b>.</p>'+
  '<div class="topics">'+Object.keys(STEPS).map(k=>'<span class="'+stepCls(k)+'">'+STEPS[k]+'</span>').join('')+'</div>'+

  '<div class="rules"><p>✔ Pick an answer.</p><p>✔ If it is wrong, read the hint and try again.</p><p>✔ You can only move on when you get it right.</p><p>★ 10 points if you get it right first time, 5 points on the second try.</p></div>'+
  '<button class="btn primary big" id="go">Start →</button></div>';
  $('#go').onclick=()=>{state.ans={};state.score=0;startTimer();go(0)};
  $('#prev').disabled=true;$('#next').hidden=true;$('#pos').textContent='';
}
function renderQ(){
  const q=Q[state.i];const L='ABC';
  $('#app').className='app '+stepCls(q.s);
  const a=state.ans[state.i]||{tries:[],done:false};
  stage.innerHTML='<div class="slide"><div class="meta"><span class="pill">'+STEPS[q.s]+'</span><span>Question '+(state.i+1)+' of '+Q.length+'</span></div>'+
   (q.ctx?'<p class="ctx">'+esc(q.ctx)+'</p>':'')+(q.code_q?codeBlock(q.code_q):'')+
   '<p class="qtext">'+esc(q.q)+'</p>'+
   '<div class="opts">'+q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'"><span class="letter">'+L[k]+'</span><span>'+(q.code?'<code>'+o.split('\n').map(hl).join('\n')+'</code>':esc(o))+'</span></button>').join('')+'</div>'+
   '<div id="fb"></div></div>';
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
  draw(a,false);
  $('#prev').disabled=false;$('#next').hidden=false;
  $('#pos').textContent=(state.i+1)+' / '+Q.length;
}
function pick(k,el){
  const q=Q[state.i];const a=state.ans[state.i]||(state.ans[state.i]={tries:[],done:false});
  if(a.done||a.tries.indexOf(k)>=0)return;
  a.tries.push(k);
  if(k===q.a){a.done=true;a.pts=a.tries.length===1?10:(a.tries.length===2?5:0);state.score+=a.pts;tone(OK);if(a.pts)confetti(a.pts===10?28:12);bumpPts()}
  else tone(NO);
  save();draw(a,true);
  try{$('#fb').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
}
function draw(a,fresh){
  const q=Q[state.i];
  document.querySelectorAll('.opt').forEach((b,j)=>{b.className='opt';b.disabled=false;
    if(a.tries.indexOf(j)>=0&&j!==q.a){b.classList.add('wrong');b.disabled=true;if(!fresh)b.style.animation='none'}
    if(a.done){b.disabled=true;if(j===q.a){b.classList.add('right');if(!fresh)b.style.animation='none'}else if(a.tries.indexOf(j)<0)b.classList.add('dim')}});
  let h='';
  if(a.done)h='<div class="fb good"><b class="v">Correct!'+(a.pts?' +'+a.pts:'')+'</b><p>'+esc(q.why)+'</p></div>';
  else if(a.tries.length)h='<div class="fb bad"><b class="v">Not quite. Try again!</b><p><b>Hint:</b> '+esc(q.hint)+'</p></div>';
  else h='<p class="lock">🔒 Pick the right answer to unlock Next.</p>';
  $('#fb').innerHTML=h;
  const n=$('#next');n.disabled=!a.done;n.classList.toggle('pulse',!!a.done);
  n.textContent=state.i===Q.length-1?'Finish →':'Next →';
  $('#bar').style.width=(Object.keys(state.ans).filter(k=>state.ans[k].done).length/Q.length*100)+'%';
  $('#pts').textContent=state.score;
}
function renderEnd(){
  $('#app').className='app';
  const first=Q.filter((q,k)=>state.ans[k]&&state.ans[k].tries.length===1).length;
  const r=first/Q.length;const stars=r>=.8?3:r>=.5?2:1;
  stage.innerHTML='<div class="slide end"><div class="scorerow"><h1>'+(stars===3?'Amazing!':stars===2?'Great work!':'Well done!')+'</h1>'+
   '<div class="stars small">'+[0,1,2].map(k=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path class="s'+(k<stars?' on':'')+'" style="animation-delay:'+(.2+k*.3)+'s" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>').join('')+'</div>'+
   '<span class="scoreline">★ '+state.score+' · '+first+' of '+Q.length+' right first time</span></div>'+
   '<div class="waitnote">✋ Finished! <b>Wait for instructions from your teacher.</b></div>'+
   '<div class="trybox"><div class="tryhead"><span class="trytag">While you wait</span><h2>Try it! Run the code yourself 🎮</h2><p>Press <b>▶ Run the code</b>, type your name and an answer, and watch each line run.</p></div>'+
   '<div class="typer"><div class="tbar"><i></i><i></i><i></i><span>main.py</span></div>'+
   '<div class="tgrid"><div class="tcode"><pre id="tcode"></pre></div><div class="tout"><div class="tlab">Screen</div><div id="tctl" class="tctl"></div><pre id="tout"></pre></div></div></div></div>'+
   '<button class="btn" id="again">↺ Try again</button></div>';
  startTyper();
  $('#again').onclick=()=>{state.ans={};state.score=0;state.t0=null;tStart=null;save();startTimer();go(0)};
  $('#next').hidden=true;$('#prev').disabled=false;$('#pos').textContent='';$('#bar').style.width='100%';$('#pts').textContent=state.score;
  confetti(70);tone([[523,.14],[659,.14],[784,.14],[1047,.4]]);
}
/* coding animation for early finishers: types a small quiz, then runs it, then repeats */
const TYPE_CODE=['print("THE PYTHON QUIZ!")','name = input("What is your name? ")','print("Welcome,", name)','','print("Which is the biggest planet?")','print("1. Earth")','print("2. Jupiter")','print("3. Mars")','answer = input("Enter 1, 2 or 3: ")','','if answer == "2":','    print("Correct!")','else:','    print("Incorrect!")','','print("QUIZ COMPLETE!")','print("Goodbye,", name)'];
const TYPE_OUT=[['THE PYTHON QUIZ!'],['What is your name? ','Alex'],['Welcome, Alex'],['Which is the biggest planet?'],['1. Earth'],['2. Jupiter'],['3. Mars'],['Enter 1, 2 or 3: ','2'],['Correct!','ok'],['QUIZ COMPLETE!'],['Goodbye, Alex']];
let typeT=[];
function stopTyper(){typeT.forEach(clearTimeout);typeT=[]}
function tlater(f,ms){typeT.push(setTimeout(f,ms))}
function startTyper(){
  stopTyper();const pc=$('#tcode');if(!pc)return;
  pc.innerHTML='';$('#tout').innerHTML='';$('#tctl').innerHTML='<button class="btn primary trun pulse" id="tskip">▶ Run the code</button><span class="thint">(the code is being typed...)</span>';$('#tskip').onclick=()=>{stopTyper();showCode();runInteractive()};
  let li=0,ci=0,done='';
  (function typeChar(){
    if(!$('#tcode'))return;
    if(li>=TYPE_CODE.length){showCode();return}
    const line=TYPE_CODE[li];
    if(ci<=line.length){$('#tcode').innerHTML=(done+line.slice(0,ci)).split('\n').map(hl).join('\n')+'<span class="tcur">▍</span>';ci++;tlater(typeChar,line.length?28:50)}
    else{done+=line+'\n';li++;ci=0;tlater(typeChar,100)}
  })();
}
function showCode(){
  const pc=$('#tcode');if(!pc)return;
  pc.innerHTML=TYPE_CODE.map(l=>'<span class="tln">'+(hl(l)||' ')+'</span>').join('');
  $('#tctl').innerHTML='<button class="btn primary trun pulse" id="trun">▶ Run the code</button>';
  $('#tout').innerHTML='<span class="thint">Press Run. Then type in the answers, just like a player!</span>';
  $('#trun').onclick=runInteractive;
}
function runInteractive(){
  stopTyper();const out=$('#tout');out.innerHTML='';const v={};
  $('#tctl').innerHTML='<span class="thint">Running... type into the screen and press Enter.</span>';
  const lines=document.querySelectorAll('#tcode .tln');
  const hot=k=>lines.forEach((l,j)=>l.classList.toggle('hot',j===k));
  const print=(t,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=t;out.appendChild(d);out.scrollTop=out.scrollHeight};
  function ask(prompt,key,next){
    const d=document.createElement('div');d.textContent=prompt;const inp=document.createElement('input');inp.className='tin';inp.id='tin-'+key;inp.setAttribute('aria-label',prompt);inp.maxLength=14;d.appendChild(inp);out.appendChild(d);try{inp.focus()}catch(e){}
    inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){e.preventDefault();e.stopPropagation();v[key]=inp.value.trim();const sp=document.createElement('span');sp.className='ttyped';sp.textContent=v[key];inp.replaceWith(sp);tone([[880,.06]]);next()}};
  }
  const steps=[[0,()=>print('THE PYTHON QUIZ!')],[1,n=>ask('What is your name? ','name',n)],[2,()=>print('Welcome, '+v.name)],
   [4,()=>print('Which is the biggest planet?')],[5,()=>print('1. Earth')],[6,()=>print('2. Jupiter')],[7,()=>print('3. Mars')],
   [8,n=>ask('Enter 1, 2 or 3: ','answer',n)],['if'],[15,()=>print('QUIZ COMPLETE!')],[16,()=>print('Goodbye, '+v.name)]];
  let k=0;
  (function step(){
    if(!$('#tout'))return;
    if(k>=steps.length){hot(-1);$('#tctl').innerHTML='<button class="btn primary trun pulse" id="trun">↺ Run it again</button><span class="thint">Try a wrong answer this time!</span>';$('#trun').onclick=runInteractive;return}
    const st=steps[k++];
    if(st[0]==='if'){hot(10);tlater(()=>{if(v.answer==='2'){hot(11);print('Correct!','tok2');tone([[660,.12],[990,.2]])}else{hot(12);tlater(()=>{hot(13);print('Incorrect!','tbad');tone([[260,.16,'triangle'],[200,.22,'triangle']])},500)}tlater(step,1100)},700);return}
    hot(st[0]);
    if(st[1].length)st[1](()=>tlater(step,400));else{st[1]();tlater(step,550)}
  })();
}
let tStart=null,tIv=null;
function startTimer(){if(!tStart){tStart=Date.now();state.t0=tStart;save()}if(tIv)return;tIv=setInterval(tickT,500);tickT()}
function tickT(){const left=Math.max(0,300-Math.floor((Date.now()-tStart)/1000));const el=$('#tmr');el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#tchip').classList.toggle('late',left===0);if(left===0){el.textContent='Time!';clearInterval(tIv);tIv=null}}
function bumpPts(){const c=$('#chip');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
function render(){stopTyper();$('#next').classList.remove('pulse');if(state.i<0)renderIntro();else if(state.i>=Q.length)renderEnd();else renderQ();$('main').scrollTop=0;save()}
function go(i){state.i=Math.max(-1,Math.min(Q.length,i));render()}
$('#next').onclick=()=>{if(state.i>=0&&state.i<Q.length&&!(state.ans[state.i]&&state.ans[state.i].done))return;go(state.i+1)};
$('#prev').onclick=()=>go(state.i-1);
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){if(!$('#next').disabled&&!$('#next').hidden)$('#next').click()}
  else if(e.key==='ArrowLeft'&&state.i>=0)go(state.i-1);
  else if(state.i>=0&&state.i<Q.length&&/^[abc]$/i.test(e.key)){const b=document.querySelector('.opt[data-k="'+'abc'.indexOf(e.key.toLowerCase())+'"]');if(b&&!b.disabled)b.click()}
});
function confetti(n){const cols=['#1f63d6','#d9480f','#0b7f8f','#a61e8c','#ffd43b','#2b8a3e'];
  for(let k=0;k<n;k++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[k%cols.length];
    d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.setProperty('--rot',(Math.random()*720-360)+'deg');d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}}
if(state.t0&&state.i>=0&&state.i<Q.length){tStart=state.t0;startTimer()}
render();
})();
</script>
